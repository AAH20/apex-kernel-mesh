name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build wheel and source archive
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - name: Install built wheel and smoke-test CLI
        run: |
          python -m pip install --no-deps --target /tmp/apex-kernel-mesh-install dist/*.whl
          PYTHONPATH=/tmp/apex-kernel-mesh-install python -m apex_kernel_mesh.cli --help
